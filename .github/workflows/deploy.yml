name: Deploy to AWS Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key_path: /home/runner/.ssh/deploy_key
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            cd ~/my-portfolio
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            docker stop my-portfolio || true
            docker rm my-portfolio || true
            docker build -t my-portfolio .
            docker run -d --name my-portfolio -p 8080:80 my-portfolio
            docker image prune -f
